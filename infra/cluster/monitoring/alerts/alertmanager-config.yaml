apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: infrastructure-slack
  namespace: monitoring
spec:
  route:
    groupBy:
      - alertname
      - instance
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 2h
    receiver: slack-infra
    matchers:
      - name: category
        value: infrastructure
  receivers:
    - name: slack-infra
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-webhook
            key: url
          channel: "#server-alerts"
          sendResolved: true
          title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
          text: |
            {{ range .Alerts -}}
            *인스턴스:* {{ .Labels.instance }}
            *요약:* {{ .Annotations.summary }}
            *상세:* {{ .Annotations.description }}
            {{- if .Annotations.temperature }}
            *온도:* {{ .Annotations.temperature }}
            {{- end }}
            {{- if .Annotations.fan_speed }}
            *팬 속도:* {{ .Annotations.fan_speed }}
            {{- end }}
            *대시보드:* <http://grafana.int.selfronny.com/d/rot824t/server-usage?orgId=1&from=now-6h&to=now&timezone=browser&refresh=auto|Server Usage Grafana>
            {{ end }}
