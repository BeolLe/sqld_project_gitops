apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqld-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqld-frontend
  template:
    metadata:
      labels:
        app: sqld-frontend
    spec:
      containers:
        - name: sqld-frontend
          image: ghcr.io/beolle/sqld-frontend@sha256:bc7097381cadbe3c327a70fb1b777014ecbb7e63aad4c9f2ed4a45316ef97f1c
          imagePullPolicy: Always
          ports:
            - containerPort: 80
