apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqld-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqld-frontend
  template:
    metadata:
      labels:
        app: sqld-frontend
    spec:
      containers:
        - name: sqld-frontend
          image: ghcr.io/beolle/sqld-frontend@sha256:e4960036c4f9d98171ccb710aff642b900389fceceb09b1a4f5cf0c5cd1bdd11
          imagePullPolicy: Always
          ports:
            - containerPort: 80
