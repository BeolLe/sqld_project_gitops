apiVersion: apps/v1
kind: Deployment
metadata:
  name: redash-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redash-server
  template:
    metadata:
      labels:
        app: redash-server
    spec:
      containers:
        - name: redash-server
          image: redash/redash:10.1.0.b50633
          imagePullPolicy: IfNotPresent
          args:
            - server
          ports:
            - containerPort: 5000
          env:
            - name: PYTHONUNBUFFERED
              value: "true"
            - name: REDASH_REDIS_URL
              value: redis://redash-redis:6379/0
            - name: REDASH_LOG_LEVEL
              value: INFO
            - name: REDASH_SCHEMAS_REFRESH_SCHEDULE
              value: "30"
            - name: REDASH_SCHEMAS_REFRESH_TIMEOUT
              value: "300"
            - name: REDASH_WEB_WORKERS
              value: "2"
          envFrom:
            - secretRef:
                name: redash-app-secret
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
